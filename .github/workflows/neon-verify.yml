name: neon-verify
# Manual only. Runs the platform's database layer and full test suite against the Neon project the owner connected to the Vercel project.
# SYNTHETIC DATA ONLY. Creates only ts_* roles and ts_t_* databases (dropped by the tests). Never prints the connection string.
# NOT part of the required `gate` and never run on pull requests, so secrets are never exposed to a PR from a fork.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-verify
  cancel-in-progress: false
jobs:
  neon:
    # Only ever from main: a dispatch from another branch would run that branch's code with the database secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: verify against Neon (synthetic data only)
        env:
          # Candidate secret names the Vercel Neon integration is known to create; the script picks the first direct *.neon.tech URL.
          NEON_CANDIDATES: |
            DATABASE_URL_UNPOOLED=${{ secrets.DATABASE_URL_UNPOOLED }}
            POSTGRES_URL_NON_POOLING=${{ secrets.POSTGRES_URL_NON_POOLING }}
            NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
        run: node scripts/neon-verify.mjs neon-verify.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: neon-verify-report, path: neon-verify.json, if-no-files-found: ignore }
