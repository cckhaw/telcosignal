name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (full history; allow-list only in .gitleaks.toml)
        run: |
          V=8.24.3
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt
          sha256sum --ignore-missing -c gitleaks_${V}_checksums.txt
          tar xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --log-opts="--all"
  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: semgrep (fails on any finding)
        run: |
          python -m pip install --no-cache-dir setuptools==75.8.0 semgrep==1.119.0
          semgrep scan --error --metrics=off --config p/typescript --config p/nodejs --config p/owasp-top-ten --config p/secrets --config .semgrep/ .
  codeql:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
  dependency-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: npm audit (high+critical block, prod and dev)
        run: npm run audit:deps
      - name: lockfile integrity - exact pins only
        run: node scripts/check-pins.mjs
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-ephemeral-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sbom, path: sbom.cdx.json }
  container-iac-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: build image
        run: docker build -f docker/Dockerfile -t telco-signal:ci .
      - name: install trivy (signed apt repository)
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy --version
      - name: trivy image (HIGH/CRITICAL block)
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --scanners vuln,secret telco-signal:ci
      - name: trivy IaC / config (HIGH/CRITICAL block)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint
  dast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: DAST against running sandbox
        run: |
          if [ ! -f deploy/compose.sandbox.yml ]; then
            echo "::warning::DAST NOT YET APPLICABLE (no runnable sandbox until M1). Recorded as not-met in compliance matrix."
            echo "DAST: not applicable yet" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          docker compose -f deploy/compose.sandbox.yml up -d --build --wait
          docker run --network host -v "$PWD/openapi:/zap/wrk:ro" ghcr.io/zaproxy/zaproxy:2.16.1 zap-api-scan.py -t /zap/wrk/participant.yaml -f openapi -c /zap/wrk/zap.conf -I -x /tmp/zap.xml || exit 1
  gate:
    if: always()
    needs: [secret-scan, sast, codeql, dependency-scan, build-test, container-iac-scan, workflow-lint, dast]
    runs-on: ubuntu-24.04
    steps:
      - name: all required jobs must succeed
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\|skipped\)"' && { echo "gate: blocked"; exit 1; } || echo "gate: pass"
