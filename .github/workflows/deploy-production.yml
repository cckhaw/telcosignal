name: deploy-production
# Production only. Runs on every merge to main. No preview deployments exist anywhere:
# Vercel's own git integration is disabled in vercel.json, and this workflow never runs on pull_request.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4.4.0
        with: { node-version: 22 }
      - name: require secrets (fail closed)
        run: |
          for v in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v missing"; exit 1; }
          done
      - name: deploy to production
        id: deploy
        run: |
          set -euo pipefail
          npm i -g vercel@67.0.0
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: wait until latest production deployment is READY, then delete all older ones
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/vercel-cleanup.mjs
