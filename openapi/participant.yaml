openapi: 3.1.0
info:
  title: Telco Signal API (sandbox reference implementation)
  version: 1.0.0
  description: |-
    SANDBOX: synthetic data only. NOT approved for live data. No certification or compliance is claimed.

    One API for SIM swap, device swap, call forwarding and KYC match signals from several telcos. Deliberate deviations from the CAMARA definitions (docs/architecture.md section 11): four-state results instead of booleans, no 404 for unknown numbers, mandatory purposeCode + consentRef, sender-constrained tokens and signed requests.
servers:
  - url: https://api.sandbox.invalid
    description: "Placeholder: the sandbox runs locally; participant mTLS cannot be terminated on the static developer-portal host"
tags:
  - name: auth
  - name: consent
  - name: signals
  - name: statements
paths:
  /oauth/token:
    post:
      tags:
        - auth
      operationId: token
      summary: Client-credentials token (private_key_jwt, mTLS-bound)
      security:
        - mutualTLS: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - grant_type
                - client_id
                - client_assertion_type
                - client_assertion
              properties:
                grant_type:
                  enum:
                    - client_credentials
                client_id:
                  type: string
                client_assertion_type:
                  enum:
                    - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                client_assertion:
                  type: string
                  description: JWT signed with your registered private key; aud = this endpoint; lifetime at most 60 s; single use
                scope:
                  type: string
      responses:
        "200":
          description: Access token bound to your client certificate (cnf.x5t#S256), lifetime at most 5 minutes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: The request did not match the published schema (unknown field, wrong type, bad format, missing purpose or consent reference).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The signed request is outside the time window or its identifier was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: A rate limit or quota was exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A security dependency (for example the replay or rate-limit store) is unavailable, so the platform refuses to serve (fail closed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /.well-known/jwks.json:
    get:
      tags:
        - auth
      operationId: jwks
      summary: Platform token-verification keys (public)
      security:
        - mutualTLS: []
      responses:
        "200":
          description: JWK Set
          content:
            application/json:
              schema:
                type: object
  /v1/consents:
    post:
      tags:
        - consent
      operationId: createConsent
      summary: Register a consent / lawful-basis reference for a subject, purpose and signals
      security: &a1
        - mutualTLS: []
          accessToken: []
      parameters: &a3
        - &a2
          $ref: "#/components/parameters/RequestSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentCreated"
        "400":
          description: The request did not match the published schema (unknown field, wrong type, bad format, missing purpose or consent reference).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The signed request is outside the time window or its identifier was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: A rate limit or quota was exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/consents/{id}:
    get:
      tags:
        - consent
      operationId: getConsent
      summary: Read one of your consents
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"
        "401":
          description: Token, client certificate binding, signature or client assertion could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such resource for your organisation (the same answer is given for other organisations' resources).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/consents/{id}/revoke:
    post:
      tags:
        - consent
      operationId: revokeConsent
      summary: Revoke a consent
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - *a2
      responses:
        "200":
          description: Revoked
        "401":
          description: The signed request is outside the time window or its identifier was already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such resource for your organisation (the same answer is given for other organisations' resources).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/signals/sim-swap/check:
    post:
      operationId: checkSimSwap
      summary: Has the SIM been swapped within maxAge hours?
      description: "Requires scope `sim-swap:check`. Answers are four-state: TRUE, FALSE, UNAVAILABLE, NOT_SUPPORTED. FALSE is returned only when the telco gave an explicit, valid negative; a timeout, error, invalid response or unsupported signal is never FALSE. Telco A speaks CAMARA SimSwap r4.3 `check`."
      security: *a1
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimSwapCheckRequest"
      responses:
        "200":
          description: Signal result (UNAVAILABLE and NOT_SUPPORTED are answered with HTTP 200 and are not charged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "400":
          description: The request did not match the published schema (unknown field, wrong type, bad format, missing purpose or consent reference).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Token, client certificate binding, signature or client assertion could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: No valid consent or lawful-basis reference for this subject, purpose and signal (missing, expired, revoked or not permitted). The reason is deliberately not disclosed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: A rate limit or quota was exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: An unexpected platform error. Details are never returned to the caller.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A security dependency (for example the replay or rate-limit store) is unavailable, so the platform refuses to serve (fail closed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/signals/device-swap/check:
    post:
      operationId: checkDeviceSwap
      summary: Has the device been swapped within maxAge hours?
      description: "Requires scope `device-swap:check`. Answers are four-state: TRUE, FALSE, UNAVAILABLE, NOT_SUPPORTED. FALSE is returned only when the telco gave an explicit, valid negative; a timeout, error, invalid response or unsupported signal is never FALSE. Telco A speaks CAMARA DeviceSwap r4.3 `check`."
      security: *a1
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSwapCheckRequest"
      responses:
        "200":
          description: Signal result (UNAVAILABLE and NOT_SUPPORTED are answered with HTTP 200 and are not charged)
          content:
            application/json:
