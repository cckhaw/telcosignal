components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: TLS 1.3 preferred (1.2 minimum) with a client certificate registered for your client
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Sender-constrained: the token is bound to your client certificate and is useless with any other"
  parameters:
    RequestSignature:
      name: X-Request-Signature
      in: header
      required: true
      description: Compact JWS (ES256 or PS256, your registered key) over {htm, htu, dig (base64url SHA-256 of the body), iat (within 60 s), jti (single use, 16-64 chars)}
      schema:
        type: string
        maxLength: 4096
  schemas:
    CreateConsentRequest:
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - consentRef
        - purposeCode
        - signals
        - expiresAt
      properties:
        phoneNumber: &a4
          type: string
          pattern: ^\+[1-9][0-9]{4,14}$
          maxLength: 16
        consentRef: &a5
          type: string
          pattern: ^[A-Za-z0-9._:-]{4,128}$
        purposeCode:
          enum:
            - FRAUD_PREVENTION
            - ACCOUNT_TAKEOVER_CHECK
            - TRANSACTION_RISK
        signals:
          type: array
          items:
            enum:
              - SIM_SWAP
              - DEVICE_SWAP
              - CALL_FORWARDING
              - KYC_MATCH
          minItems: 1
          maxItems: 4
          uniqueItems: true
        expiresAt:
          type: string
          maxLength: 40
    SimSwapCheckRequest: &a6
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - purposeCode
        - consentRef
      properties:
        phoneNumber: *a4
        maxAge:
          type: integer
          minimum: 1
          maximum: 2400
        purposeCode:
          enum:
            - FRAUD_PREVENTION
            - ACCOUNT_TAKEOVER_CHECK
            - TRANSACTION_RISK
        consentRef: *a5
    DeviceSwapCheckRequest: *a6
    CallForwardingCheckRequest:
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - purposeCode
        - consentRef
      properties:
        phoneNumber: *a4
        purposeCode:
          enum:
            - FRAUD_PREVENTION
            - ACCOUNT_TAKEOVER_CHECK
            - TRANSACTION_RISK
        consentRef: *a5
    KycMatchRequest:
      type: object
      additionalProperties: false
      required:
        - phoneNumber
        - purposeCode
        - consentRef
      properties:
        phoneNumber: *a4
        purposeCode:
          enum:
            - FRAUD_PREVENTION
            - ACCOUNT_TAKEOVER_CHECK
            - TRANSACTION_RISK
        consentRef: *a5
        idDocument: &a7
          type: string
          minLength: 1
          maxLength: 256
        name: *a7
        givenName: *a7
        familyName: *a7
        address: *a7
        birthdate: *a7
        email: *a7
        postalCode: *a7
        country: *a7
      anyOf:
        - required:
            - idDocument
          properties:
            idDocument: *a7
        - required:
            - name
          properties:
            name: *a7
        - required:
            - givenName
          properties:
            givenName: *a7
        - required:
            - familyName
          properties:
            familyName: *a7
        - required:
            - address
          properties:
            address: *a7
        - required:
            - birthdate
          properties:
            birthdate: *a7
        - required:
            - email
          properties:
            email: *a7
        - required:
            - postalCode
          properties:
            postalCode: *a7
        - required:
            - country
          properties:
            country: *a7
    SignalResponse:
      type: object
      required:
        - signal
        - result
        - correlationId
      properties:
        signal:
          enum:
            - SIM_SWAP
            - DEVICE_SWAP
            - CALL_FORWARDING
            - KYC_MATCH
        result:
          enum:
            - "TRUE"
            - "FALSE"
            - UNAVAILABLE
            - NOT_SUPPORTED
        fields:
          type: object
          description: "KYC match only: per-attribute MATCH / NO_MATCH / NOT_AVAILABLE"
          additionalProperties:
            enum:
              - MATCH
              - NO_MATCH
              - NOT_AVAILABLE
        correlationId:
          type: string
          format: uuid
    Problem:
      type: object
      required:
        - status
        - code
        - message
        - correlationId
      properties:
        status:
          type: integer
        code:
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_FAILED
            - ACCESS_DENIED
            - CONSENT_REQUIRED
            - REPLAY_REJECTED
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - NOT_FOUND
            - INTERNAL
            - SERVICE_UNAVAILABLE
        message:
          type: string
        correlationId:
          type: string
      description: Errors never reveal internals and never disclose whether a number exists.
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
        token_type:
          enum:
            - Bearer
        expires_in:
          type: integer
          maximum: 300
        scope:
          type: string
    ConsentCreated:
      type: object
      required:
        - id
        - consentRef
        - correlationId
      properties:
        id:
          type: string
          format: uuid
        consentRef:
          type: string
        correlationId:
          type: string
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        consentRef:
          type: string
        purposeCode:
          type: string
        signals:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        correlationId:
          type: string
    StatementSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        currency:
          type: string
        usageCount:
          type: integer
        totalMinor:
          type: integer
          description: Integer minor units; prices are placeholders in the sandbox
