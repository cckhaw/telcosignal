              schema:
                $ref: "#/components/schemas/Problem"
  /v1/statements:
    get:
      tags:
        - statements
      operationId: listStatements
      summary: Your settlement statements
      security: *a1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatementSummary"
                  correlationId:
                    type: string
        "401":
          description: Token, client certificate binding, signature or client assertion could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/statements/{id}:
    get:
      tags:
        - statements
      operationId: getStatement
      summary: One of your statements, with line items
      security: *a1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          description: Token, client certificate binding, signature or client assertion could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "The caller is authenticated but not permitted: scope not granted, signal or purpose not entitled, or the participant is suspended."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such resource for your organisation (the same answer is given for other organisations' resources).
          content:
            application/problem+json:
              schema:
