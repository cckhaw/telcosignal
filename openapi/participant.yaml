              schema:
                $ref: "#/components/schemas/Problem"
  /v1/signals/call-forwarding/check:
    post:
      operationId: checkCallForwarding
      summary: Is unconditional call forwarding active?
      description: "Requires scope `call-forwarding:check`. Answers are four-state: TRUE, FALSE, UNAVAILABLE, NOT_SUPPORTED. FALSE is returned only when the telco gave an explicit, valid negative; a timeout, error, invalid response or unsupported signal is never FALSE. Telco A speaks CAMARA CallForwardingSignal r4.3."
      security: *a1
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallForwardingCheckRequest"
      responses:
        "200":
          description: Signal result (UNAVAILABLE and NOT_SUPPORTED are answered with HTTP 200 and are not charged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "400":
          description: The request did not match the published schema (unknown field, wrong type, bad format, missing purpose or consent reference).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Token, client certificate binding, signature or client assertion could not be verified.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: No valid consent or lawful-basis reference for this subject, purpose and signal (missing, expired, revoked or not permitted). The reason is deliberately not disclosed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: A rate limit or quota was exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: An unexpected platform error. Details are never returned to the caller.
          content:
