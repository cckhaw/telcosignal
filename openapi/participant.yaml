        "503":
          description: A security dependency (for example the replay or rate-limit store) is unavailable, so the platform refuses to serve (fail closed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/signals/kyc-match/check:
    post:
      operationId: checkKycMatch
      summary: Do the supplied identity attributes match the subscriber record?
      description: "Requires scope `kyc-match:check`. Answers are four-state: TRUE, FALSE, UNAVAILABLE, NOT_SUPPORTED. FALSE is returned only when the telco gave an explicit, valid negative; a timeout, error, invalid response or unsupported signal is never FALSE. KYC inputs are processed in memory only and are never stored or logged. Telco A speaks CAMARA KYC Match r2.2."
      security: *a1
      parameters: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycMatchRequest"
      responses:
        "200":
          description: Signal result (UNAVAILABLE and NOT_SUPPORTED are answered with HTTP 200 and are not charged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalResponse"
        "400":
          description: The request did not match the published schema (unknown field, wrong type, bad format, missing purpose or consent reference).
          content:
            application/problem+json:
