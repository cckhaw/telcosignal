rules:
  - id: no-raw-sql-concat
    languages: [typescript]
    severity: ERROR
    message: Use parameterised queries only.
    pattern-either:
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.query($A + $B)
  - id: no-custom-crypto-primitives
    languages: [typescript]
    severity: ERROR
    message: Do not hand-roll crypto; use jose / KMS interface.
    pattern-either:
      - pattern: crypto.createCipher(...)
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
  - id: no-tls-verify-off
    languages: [typescript]
    severity: ERROR
    message: TLS verification must never be disabled.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
